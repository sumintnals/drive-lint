[project]
name = "drivelint"
version = "0.1.0"
description = "Android Auto Car App Library 소스를 정적 분석해 Design for Driving 가이드라인 위반을 검출하는 CLI"
requires-python = ">=3.9"

[project.scripts]
drivelint = "drivelint.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drivelint*"]
